<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TextEnter - Настройки</title>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #0a0c10; color: #e5e7eb;
      font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    .shell { max-width: 640px; margin: 0 auto; padding: 80px 24px; text-align: center; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin: 6px 0; }
    code { background: #111827; border: 1px solid #263041; border-radius: 6px; padding: 2px 6px; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 20px; border: 3px solid #263041;
      border-top-color: #6366f1; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="spinner"></div>
    <h1>Открываю настройки TextEnter…</h1>
    <p>Страница настроек рендерит пользовательский скрипт TextEnter.</p>
    <p>Если этот текст не исчез — скрипт не установлен или менеджер скриптов<br>
       (Tampermonkey / ScriptCat) не запустился на этой странице.<br>
       Установите скрипт со <a href="https://github.com/David0O7/TextEnter" style="color:#818cf8">страницы проекта</a>.</p>
  </div>
</body>
</html>
